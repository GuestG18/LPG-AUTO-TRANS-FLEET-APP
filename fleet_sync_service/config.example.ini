; Copy this file to config.ini and fill in real credentials.
; Never commit config.ini to Git.

[vps_database]
; When [ssh_tunnel] enabled=true, this host/port is not contacted directly.
; The sync service connects to local_bind_host:local_bind_port instead.
host = your-vps-mysql-host
port = 3306
database = production_database_name
user = production_database_user
password = production_database_password
charset = utf8mb4
connect_timeout = 10
read_timeout = 60
write_timeout = 60

[ssh_tunnel]
enabled = true
host = VPS_IP
port = 22
user = root
password =
private_key =
remote_bind_host = 127.0.0.1
remote_bind_port = 3306
local_bind_host = 127.0.0.1
local_bind_port = 3307

[local_database]
host = 127.0.0.1
port = 3306
database = local_database_name
user = root
password =
charset = utf8mb4
connect_timeout = 10
read_timeout = 60
write_timeout = 60

[sync]
; Comma-separated list. Only these tables are synchronized.
; Add tables only after verifying they have a primary key and updated_at or created_at.
tables =
    utilizatori,
    vehicule,
    soferi,
    alimentari,
    mentenanta,
    documente,
    documente_soferi,
    concedii,
    curse_dispecer,
    curse_cheltuieli
batch_size = 500
state_file = state/last_sync.json
initial_timestamp = 1970-01-01 00:00:00

[logging]
level = INFO
file = logs/sync_data.log
max_bytes = 5242880
backup_count = 5

[migrations]
directory = ../database/migrations
log_file = ../database/migrations/migrations.log
schema_table = schema_migrations
